version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    versioning-strategy: "increase"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "03:00"
      timezone: "America/New_York"
    groups:
      hundred-and-ten:
        patterns:
          - "hundredandten*"
      dev-dependencies:
        dependency-type: "development"
      # Security fixes land as a single PR instead of one per package.
      # The groups above only apply to scheduled version updates.
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
